<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <base href="/driftking/" />
    <title>DriftKing · Karten-Vorschau</title>
    <link rel="stylesheet" href="css/base.css" />
    <style>
        #info { position: fixed; left: 10px; top: 10px; z-index: 5; font: 12px/1.4 var(--dk-mono); color: #fff; background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 6px; white-space: pre; }
    </style>
    <script type="importmap">{ "imports": { "three": "./lib/three/three.module.js", "three/addons/": "./lib/three/addons/" } }</script>
</head>
<body>
    <!-- maps.html?map=pass|deck|harbor|city&view=top|orbit|road&time=night|dusk&quality=low|medium|high&at=0.3 (road: a camera on the course at that lap fraction) -->
    <div id="dk-stage" class="stage"></div>
    <div id="info"></div>
    <script type="module">
        import * as THREE from 'three';
        import { settings } from './js/game/settings.js';
        import { createStage } from './js/game/render/stage.js';
        import { buildWorld } from './js/game/world/world.js';

        const q = new URLSearchParams(location.search);
        if (q.get('quality')) settings.set({ quality: q.get('quality') });
        const stage = createStage(document.getElementById('dk-stage'));
        const started = performance.now();
        const world = await buildWorld(q.get('map') ?? 'city', { timeOfDay: q.get('time') ?? 'night' });
        const built = performance.now() - started;
        const camera = new THREE.PerspectiveCamera(60, 1, 0.5, 2400);
        const course = world.course;
        let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
        for (let i = 0; i < course.count; i++) {
            minX = Math.min(minX, course.x[i]); maxX = Math.max(maxX, course.x[i]);
            minZ = Math.min(minZ, course.z[i]); maxZ = Math.max(maxZ, course.z[i]);
        }
        const centre = new THREE.Vector3((minX + maxX) / 2, 0, (minZ + maxZ) / 2);
        const span = Math.max(maxX - minX, maxZ - minZ);
        const view = q.get('view') ?? 'orbit';
        const at = Number(q.get('at') ?? 0);
        const target = new THREE.Vector3();
        if (view === 'top') {
            world.scene.fog = null;
            // the course as a bright line above everything
            const points = [];
            for (let i = 0; i <= course.count; i++) points.push(new THREE.Vector3(course.x[i % course.count], course.y[i % course.count] + 1, course.z[i % course.count]));
            world.scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), new THREE.LineBasicMaterial({ color: 0xff2e88 })));
        }
        stage.show({
            scene: world.scene,
            camera,
            update(dt, time) {
                if (view === 'top') {
                    camera.position.set(centre.x, span * 1.05, centre.z + 1);
                    camera.lookAt(centre);
                } else if (view === 'road') {
                    const p = course.at(at * course.length);
                    const ahead = course.at(at * course.length + 25);
                    camera.position.set(p.x, p.y + 3, p.z);
                    camera.lookAt(ahead.x, ahead.y + 1, ahead.z);
                } else {
                    const a = time * 0.05 + 0.6;
                    camera.position.set(centre.x + Math.cos(a) * span * 0.75, span * 0.32 + 20, centre.z + Math.sin(a) * span * 0.75);
                    camera.lookAt(centre.x, 0, centre.z);
                }
                target.copy(camera.position);
                world.update(dt, target);
                document.getElementById('info').textContent =
                    `${world.name} · ${Math.round(course.length)} m · built ${Math.round(built)} ms · ${stage.fps.toFixed(0)} fps · calls ${stage.renderer.info.render.calls} · tris ${stage.renderer.info.render.triangles}`;
            },
        });
        window.__ready = true;
    </script>
</body>
</html>
